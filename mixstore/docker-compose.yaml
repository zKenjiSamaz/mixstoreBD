services:

  mysql-db:
    image: mysql:8.0
    container_name: mixstore_mysql
    environment:
      MYSQL_ROOT_PASSWORD: MixStore2026!
      MYSQL_DATABASE: punto_venta_db
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  postgres-db:
    image: postgres:15
    container_name: mixstore_postgres
    environment:
      POSTGRES_USER: mixstore
      POSTGRES_PASSWORD: MixStore2026!
      POSTGRES_DB: ecommerce_auditoria_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  sqlserver-db:
    image: mcr.microsoft.com/azure-sql-edge
    container_name: mixstore_sqlserver
    environment:
      ACCEPT_EULA: "Y"
      SA_PASSWORD: "MixStore2026!"
    ports:
      - "1433:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
#admin por defecto es sa
volumes:
  mysql_data:
  postgres_data:
  sqlserver_data:
